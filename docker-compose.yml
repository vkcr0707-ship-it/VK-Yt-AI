services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - generated_media:/app/public/gen

  render-worker:
    build:
      context: .
      dockerfile: Dockerfile.render-worker
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WORKER_MODE: external
      WORKER_POLL_MS: 2000
    restart: unless-stopped
    volumes:
      - generated_media:/app/public/gen

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  generated_media:
  redis_data:
